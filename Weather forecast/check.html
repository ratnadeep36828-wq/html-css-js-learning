<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Elements</title>
    <link rel="stylesheet" href="check.css" />
</head>
<body>
    <article class="forecast">
        <i><h1>Kolkata <abbr>"week<span>ly</span>"</abbr> weather forecast</h1></i>
        <artical class="day-forcast" id="color1">
            <h2>&#x1F327; 14 june 2026</h2>
            <p>Rain.</p>
        </artical>


        <artical class="day-forcast" id="color2">
            <h2>&#x2614; 15 june 2026</h2>
            <p>Periods of rain.</p>
        </artical>


        <artical class="day-forcast" id="color3">
            <h2>&#128166; 16 june 2026</h2>
            <p>Heavy rain.</p>
        </artical>


        <artical class="day-forcast" id="color4">
            <h2>&#9925; 17 june 2026</h2>
            <p>Partly sunny.</p>
        </artical>


        <artical class="day-forcast" id="color5">
            <h2>&#9889; 18 june 2026</h2>
            <p>Thundershower.</p>
        </artical>


        <artical class="day-forcast" id="color6">
            <h2>&#9729; 19 june 2026</h2>
            <p>Light rain.</p>
        </artical>


        <artical class="day-forcast" id="color7">
            <h2>&#127785; 20 june 2026</h2>
            <p>Scattered thunderstorms.</p>
        </artical>
    </article>
</body>
</html>
